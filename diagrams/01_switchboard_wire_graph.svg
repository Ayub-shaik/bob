<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-label="Bob switchboard wire graph">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fdba74" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="violet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c4b5fd" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  <rect width="960" height="520" fill="url(#bg1)" rx="16"/>
  <text x="480" y="36" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="18" font-weight="700">Bob Switchboard  Raw Drivers ’ Combos ’ Governance</text>

  <!-- Column A -->
  <text x="120" y="72" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="0.08em">LAYER A · DRIVERS</text>
  <g fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.2">
    <rect x="40" y="90" width="160" height="28" rx="6"/><text x="120" y="108" text-anchor="middle" fill="#e0f2fe" font-size="11">rtk · context-mode</text>
    <rect x="40" y="130" width="160" height="28" rx="6"/><text x="120" y="148" text-anchor="middle" fill="#e0f2fe" font-size="11">graft · ast-crux</text>
    <rect x="40" y="170" width="160" height="28" rx="6"/><text x="120" y="188" text-anchor="middle" fill="#e0f2fe" font-size="11">mnemosyne · weknora</text>
    <rect x="40" y="210" width="160" height="28" rx="6"/><text x="120" y="228" text-anchor="middle" fill="#e0f2fe" font-size="11">oxlint · ocr · bugbot</text>
    <rect x="40" y="250" width="160" height="28" rx="6"/><text x="120" y="268" text-anchor="middle" fill="#e0f2fe" font-size="11">worktrunk · superlogic</text>
    <rect x="40" y="290" width="160" height="28" rx="6"/><text x="120" y="308" text-anchor="middle" fill="#e0f2fe" font-size="11">cua · playwright · artemis</text>
  </g>

  <!-- Column B -->
  <text x="480" y="72" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="0.08em">LAYER B · COMBOS</text>
  <g fill="#431407" stroke="#fb923c" stroke-width="1.5">
    <rect x="360" y="100" width="240" height="32" rx="8"/><text x="480" y="120" text-anchor="middle" fill="#ffedd5" font-size="12" font-weight="600">Token Diet</text>
    <rect x="360" y="148" width="240" height="32" rx="8"/><text x="480" y="168" text-anchor="middle" fill="#ffedd5" font-size="12" font-weight="600">AST Graph · Blast Radius</text>
    <rect x="360" y="196" width="240" height="32" rx="8"/><text x="480" y="216" text-anchor="middle" fill="#ffedd5" font-size="12" font-weight="600">Invariant Lock · Audit Pipeline</text>
    <rect x="360" y="244" width="240" height="32" rx="8"/><text x="480" y="264" text-anchor="middle" fill="#ffedd5" font-size="12" font-weight="600">Causal Loop · Gesture Trace</text>
    <rect x="360" y="292" width="240" height="32" rx="8"/><text x="480" y="312" text-anchor="middle" fill="#ffedd5" font-size="12" font-weight="600">Worktree ISO · Surgical Fixer</text>
  </g>

  <!-- Column C -->
  <text x="840" y="72" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="0.08em">CORE C · KERNEL</text>
  <g fill="#422006" stroke="#facc15" stroke-width="1.8">
    <rect x="760" y="140" width="160" height="48" rx="10"/><text x="840" y="162" text-anchor="middle" fill="#fef08a" font-size="11" font-weight="700">Contract Gate</text><text x="840" y="178" text-anchor="middle" fill="#fde68a" font-size="9">requirements + acceptance</text>
    <rect x="760" y="220" width="160" height="48" rx="10"/><text x="840" y="242" text-anchor="middle" fill="#fef08a" font-size="11" font-weight="700">Forensic Kernel</text><text x="840" y="258" text-anchor="middle" fill="#fde68a" font-size="9">bob + task-supervisor</text>
  </g>

  <!-- Wires -->
  <path d="M200 104 Q280 104 360 116" fill="none" stroke="url(#cyan)" stroke-width="1.5" opacity="0.7"/>
  <path d="M200 144 Q300 130 360 164" fill="none" stroke="url(#cyan)" stroke-width="1.5" opacity="0.65"/>
  <path d="M200 184 Q320 200 360 212" fill="none" stroke="url(#cyan)" stroke-width="1.5" opacity="0.6"/>
  <path d="M200 224 Q300 240 360 260" fill="none" stroke="url(#cyan)" stroke-width="1.5" opacity="0.6"/>
  <path d="M600 116 Q680 130 760 164" fill="none" stroke="url(#amber)" stroke-width="1.8" opacity="0.75"/>
  <path d="M600 212 Q700 200 760 244" fill="none" stroke="url(#amber)" stroke-width="1.8" opacity="0.75"/>
  <path d="M600 260 Q720 280 760 244" fill="none" stroke="url(#violet)" stroke-width="1.2" opacity="0.5" stroke-dasharray="4 4"/>

  <text x="480" y="400" text-anchor="middle" fill="#64748b" font-size="11">Drivers feed combos inward · Combos mesh peer-to-peer · Kernel governs loss = 0</text>
</svg>
