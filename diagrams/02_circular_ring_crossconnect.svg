<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-label="Bob circular combo cross-connect ring">
  <defs>
    <radialGradient id="ringBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="640" height="640" fill="url(#ringBg)" rx="20"/>
  <text x="320" y="40" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="16" font-weight="700">Layer B Combo Mesh  Cross-Domain Invariant Propagation</text>

  <circle cx="320" cy="340" r="200" fill="none" stroke="rgba(251,146,60,0.2)" stroke-width="1.5" stroke-dasharray="6 8"/>
  <circle cx="320" cy="340" r="120" fill="rgba(250,204,21,0.04)" stroke="rgba(250,204,21,0.35)" stroke-width="1.2"/>

  <!-- 8 combo nodes on ring -->
  <g filter="url(#softGlow)">
    <rect x="288" y="108" width="64" height="28" rx="7" fill="#431407" stroke="#fdba74" stroke-width="1.5"/><text x="320" y="126" text-anchor="middle" fill="#ffedd5" font-size="9" font-weight="600">Token Diet</text>
    <rect x="468" y="188" width="64" height="28" rx="7" fill="#431407" stroke="#fdba74" stroke-width="1.5"/><text x="500" y="206" text-anchor="middle" fill="#ffedd5" font-size="9" font-weight="600">AST Graph</text>
    <rect x="508" y="326" width="64" height="28" rx="7" fill="#431407" stroke="#fdba74" stroke-width="1.5"/><text x="540" y="344" text-anchor="middle" fill="#ffedd5" font-size="9" font-weight="600">Audit</text>
    <rect x="428" y="468" width="64" height="28" rx="7" fill="#431407" stroke="#fdba74" stroke-width="1.5"/><text x="460" y="486" text-anchor="middle" fill="#ffedd5" font-size="9" font-weight="600">Causal Loop</text>
    <rect x="288" y="508" width="64" height="28" rx="7" fill="#431407" stroke="#fdba74" stroke-width="1.5"/><text x="320" y="526" text-anchor="middle" fill="#ffedd5" font-size="9" font-weight="600">Gesture</text>
    <rect x="108" y="468" width="64" height="28" rx="7" fill="#431407" stroke="#fdba74" stroke-width="1.5"/><text x="140" y="486" text-anchor="middle" fill="#ffedd5" font-size="9" font-weight="600">State Reality</text>
    <rect x="68" y="326" width="64" height="28" rx="7" fill="#431407" stroke="#fdba74" stroke-width="1.5"/><text x="100" y="344" text-anchor="middle" fill="#ffedd5" font-size="9" font-weight="600">Worktree</text>
    <rect x="148" y="188" width="64" height="28" rx="7" fill="#431407" stroke="#fdba74" stroke-width="1.5"/><text x="180" y="206" text-anchor="middle" fill="#ffedd5" font-size="9" font-weight="600">Invariant</text>
  </g>

  <!-- Cross links -->
  <path d="M320 136 Q400 200 500 202" fill="none" stroke="rgba(251,146,60,0.35)" stroke-width="1.2"/>
  <path d="M500 216 Q520 320 540 340" fill="none" stroke="rgba(251,146,60,0.3)" stroke-width="1.2"/>
  <path d="M460 496 Q380 420 320 340" fill="none" stroke="rgba(251,146,60,0.35)" stroke-width="1.2"/>
  <path d="M140 496 Q220 420 320 340" fill="none" stroke="rgba(251,146,60,0.3)" stroke-width="1.2"/>
  <path d="M180 202 Q250 260 320 340" fill="none" stroke="rgba(56,189,248,0.25)" stroke-width="1"/>
  <path d="M500 340 Q420 340 320 340" fill="none" stroke="rgba(56,189,248,0.25)" stroke-width="1"/>

  <!-- Core -->
  <rect x="272" y="316" width="96" height="48" rx="10" fill="#422006" stroke="#fde047" stroke-width="2"/>
  <text x="320" y="338" text-anchor="middle" fill="#fef08a" font-size="10" font-weight="800">CORE C</text>
  <text x="320" y="352" text-anchor="middle" fill="#fde68a" font-size="8">Loss = 0</text>

  <text x="320" y="600" text-anchor="middle" fill="#64748b" font-size="10">Peer mesh propagates blast-radius & invariant locks before edits land</text>
</svg>
