<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bob — Autonomic Network Architecture</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #000;
      color: #c8d0d8;
      min-height: 100vh;
    }
    header {
      padding: 16px 20px;
      border-bottom: 1px solid #1a1a1a;
      background: #000;
    }
    header h1 { margin: 0; font-size: 18px; letter-spacing: 0.02em; color: #e8ecef; }
    header p { margin: 6px 0 0; font-size: 13px; color: #6a7580; max-width: 72ch; }
    main {
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 0;
      min-height: calc(100vh - 88px);
    }
    @media (max-width: 960px) {
      main { grid-template-columns: 1fr; }
      #inspector { border-left: none; border-top: 1px solid #1a1a1a; }
    }
    #graphHost {
      min-height: 680px;
      background: #000;
      overflow: hidden;
    }
    #graphHost svg { width: 100%; height: 100%; min-height: 680px; display: block; }
    #inspector {
      background: #000;
      border-left: 1px solid #1a1a1a;
      padding: 20px;
      overflow-y: auto;
      max-height: calc(100vh - 88px);
    }
    .legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 10px; font-size: 11px; }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .dot { width: 10px; height: 10px; border-radius: 3px; }
  </style>
</head>
<body>
  <header>
    <h1>AUTONOMIC NETWORK ARCHITECTURE</h1>
    <p><strong>(( — ))</strong> layout: outer drivers <code>((</code>, inner combos <code>(</code>, core <code>—</code>, mirrored <code>)</code> <code>))</code>. Drag boxes; thin connectors follow. Ctrl+scroll zoom. Click for details.</p>
    <div class="legend">
      <span><i class="dot" style="background:#38bdf8"></i> A→B driver feeds</span>
      <span><i class="dot" style="background:#fb923c"></i> B↔B combo mesh</span>
      <span><i class="dot" style="background:#facc15"></i> B→C kernel streams</span>
    </div>
  </header>
  <main>
    <div id="graphHost">
      <svg id="bobNeuralSvg" aria-label="Bob interactive architecture graph"></svg>
    </div>
    <aside id="inspector">
      <p style="color:#94a3b8;font-size:13px;margin:0">Click any box to inspect wiring and invariants.</p>
    </aside>
  </main>
  <script src="bob-graph-data.js"></script>
  <script src="bob-graph.js"></script>
  <script>
    BobGraph.mount({
      svg: document.getElementById("bobNeuralSvg"),
      inspector: document.getElementById("inspector"),
      container: document.getElementById("graphHost"),
    });
  </script>
</body>
</html>
